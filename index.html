<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Planet Explosion & Restore 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
    }
  </style>
  <!-- Thư viện Three.js và OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;

    // --- 1. TẠO HÀNH TINH TRÁI TIM 3D CHÍNH GIỮA ---
    const heartParticleCount = 8000;
    const heartGeometry = new THREE.BufferGeometry();
    const heartPositions = new Float32Array(heartParticleCount * 3);
    const originalPositions = new Float32Array(heartParticleCount * 3); // Lưu vị trí gốc để phục hồi
    const heartColors = new Float32Array(heartParticleCount * 3);
    const velocities = [];

    const heartBaseColor = new THREE.Color("#ff1493");

    for (let i = 0; i < heartParticleCount; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let u = Math.PI * (Math.random() * 2 - 1);

      let x = 16 * Math.pow(Math.sin(t), 3) * Math.cos(u);
      let y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      let z = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);

      let factor = 0.55 + Math.random() * 0.15;
      let px = x * factor;
      let py = y * factor;
      let pz = z * factor;

      heartPositions[i * 3] = px;
      heartPositions[i * 3 + 1] = py;
      heartPositions[i * 3 + 2] = pz;

      originalPositions[i * 3] = px;
      originalPositions[i * 3 + 1] = py;
      originalPositions[i * 3 + 2] = pz;

      let dir = new THREE.Vector3(px, py, pz).normalize();
      let speed = 0.4 + Math.random() * 0.6;
      velocities.push(dir.multiplyScalar(speed));

      heartColors[i * 3] = heartBaseColor.r + (Math.random() - 0.5) * 0.15;
      heartColors[i * 3 + 1] = heartBaseColor.g + (Math.random() - 0.5) * 0.15;
      heartColors[i * 3 + 2] = heartBaseColor.b + (Math.random() - 0.5) * 0.15;
    }

    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMaterial = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });

    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    scene.add(heartMesh);

    // --- 2. TẠO VÀNH ĐAI HẠT SÁNG (COSMIC RING) ---
    const ringParticleCount = 10000;
    const ringGeometry = new THREE.BufferGeometry();
    const ringPositions = new Float32Array(ringParticleCount * 3);
    const ringColors = new Float32Array(ringParticleCount * 3);

    const innerRadius = 10;
    const outerRadius = 35; 
    const ringColor1 = new THREE.Color("#ff3399");
    const ringColor2 = new THREE.Color("#00ffff");

    for (let i = 0; i < ringParticleCount; i++) {
      let angle = Math.random() * Math.PI * 2;
      let radius = innerRadius + Math.random() * (outerRadius - innerRadius);

      let x = Math.cos(angle) * radius;
      let z = Math.sin(angle) * radius;
      let y = (Math.random() - 0.5) * 1.8; 

      ringPositions[i * 3] = x;
      ringPositions[i * 3 + 1] = y;
      ringPositions[i * 3 + 2] = z;

      let mixedColor = ringColor1.clone().lerp(ringColor2, Math.random());
      ringColors[i * 3] = mixedColor.r;
      ringColors[i * 3 + 1] = mixedColor.g;
      ringColors[i * 3 + 2] = mixedColor.b;
    }

    ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
    ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

    const ringMaterial = new THREE.PointsMaterial({
      size: 0.4,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });

    const ringMesh = new THREE.Points(ringGeometry, ringMaterial);
    ringMesh.rotation.x = Math.PI / 4;
    ringMesh.rotation.z = Math.PI / 6;
    scene.add(ringMesh);

    // --- 3. LOGIC NỔ VÀ TỰ ĐỘNG KHÔI PHỤC ---
    // State: 'normal' -> 'exploding' -> 'restoring' -> 'normal'
    let state = 'normal';

    function triggerEffect() {
      if (state === 'normal') {
        state = 'exploding';
        // Sau 1.8 giây nổ tỏa ra thì bắt đầu chuyển sang chế độ thu hồi khôi phục
        setTimeout(() => {
          state = 'restoring';
        }, 1800);
      }
    }

    window.addEventListener('click', triggerEffect);
    window.addEventListener('touchstart', triggerEffect);

    // --- 4. ANIMATION VÀ VÒNG LẶP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      controls.update();

      const pos = heartGeometry.attributes.position.array;

      if (state === 'normal') {
        // Trạng thái bình thường
        heartMesh.rotation.y = elapsedTime * 0.2;
        ringMesh.rotation.y = -elapsedTime * 0.15;

        const beat = 1 + Math.sin(elapsedTime * 4) * 0.06 + Math.pow(Math.sin(elapsedTime * 8), 2) * 0.03;
        heartMesh.scale.set(beat, beat, beat);

        heartMaterial.opacity = 0.95;
        ringMaterial.opacity = 0.9;
      } 
      else if (state === 'exploding') {
        // Trạng thái nổ tỏa hạt ra ngoài
        for (let i = 0; i < heartParticleCount; i++) {
          pos[i * 3] += velocities[i].x;
          pos[i * 3 + 1] += velocities[i].y;
          pos[i * 3 + 2] += velocities[i].z;
        }
        heartGeometry.attributes.position.needsUpdate = true;

        if (heartMaterial.opacity > 0) heartMaterial.opacity -= 0.015;
        if (ringMaterial.opacity > 0) ringMaterial.opacity -= 0.015;
      } 
      else if (state === 'restoring') {
        // Trạng thái thu hồi hạt sáng về vị trí hình trái tim ban đầu
        let arrivedCount = 0;
        const speedFactor = 0.1; // Tốc độ di chuyển về hình gốc

        for (let i = 0; i < heartParticleCount; i++) {
          let ox = originalPositions[i * 3];
          let oy = originalPositions[i * 3 + 1];
          let oz = originalPositions[i * 3 + 2];

          pos[i * 3] += (ox - pos[i * 3]) * speedFactor;
          pos[i * 3 + 1] += (oy - pos[i * 3 + 1]) * speedFactor;
          pos[i * 3 + 2] += (oz - pos[i * 3 + 2]) * speedFactor;

          // Kiểm tra xem hạt đã về gần vị trí gốc chưa
          let dist = Math.abs(pos[i * 3] - ox) + Math.abs(pos[i * 3 + 1] - oy) + Math.abs(pos[i * 3 + 2] - oz);
          if (dist < 0.1) arrivedCount++;
        }

        heartGeometry.attributes.position.needsUpdate = true;

        // Hiện mờ dần trở lại
        if (heartMaterial.opacity < 0.95) heartMaterial.opacity += 0.02;
        if (ringMaterial.opacity < 0.9) ringMaterial.opacity += 0.02;

        // Khi đại đa số các hạt đã về vị trí cũ thì quay lại trạng thái normal
        if (arrivedCount > heartParticleCount * 0.85) {
          state = 'normal';
          // Đặt lại chính xác vị trí gốc
          for (let i = 0; i < heartParticleCount * 3; i++) {
            pos[i] = originalPositions[i];
          }
          heartGeometry.attributes.position.needsUpdate = true;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
