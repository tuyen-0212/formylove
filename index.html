<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>
  <!-- Thư viện Three.js và OrbitControls để xoay / zoom bằng chuột và cảm ứng -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Kích hoạt điều khiển xoay 3D / Zoom bằng chuột & vuốt cảm ứng
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;

    // Tạo hình trái tim 3D từ các hạt sáng (Particles)
    const particleCount = 7000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const baseColor = new THREE.Color("#ff1493");

    for (let i = 0; i < particleCount; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let u = Math.PI * (Math.random() * 2 - 1);

      let x = 16 * Math.pow(Math.sin(t), 3) * Math.cos(u);
      let y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      let z = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);

      let factor = 0.6 + Math.random() * 0.2;
      positions[i * 3] = x * factor;
      positions[i * 3 + 1] = y * factor;
      positions[i * 3 + 2] = z * factor;

      colors[i * 3] = baseColor.r + (Math.random() - 0.5) * 0.2;
      colors[i * 3 + 1] = baseColor.g + (Math.random() - 0.5) * 0.2;
      colors[i * 3 + 2] = baseColor.b + (Math.random() - 0.5) * 0.2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const heartMesh = new THREE.Points(geometry, material);
    scene.add(heartMesh);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Cập nhật tọa độ xoay/zoom khi người dùng dùng chuột
      controls.update();

      // Tự động xoay nhẹ trái tim khi không di chuột
      heartMesh.rotation.y += 0.005;

      // Hiệu ứng nhịp đập 3D
      const beat = 1 + Math.sin(elapsedTime * 4) * 0.07 + Math.pow(Math.sin(elapsedTime * 8), 2) * 0.03;
      heartMesh.scale.set(beat, beat, beat);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
